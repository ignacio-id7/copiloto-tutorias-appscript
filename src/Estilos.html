<style>
  /* Identidad visual de Impulsa DIE (tokens.css de la versión anterior). Un solo esquema
     oscuro, el de la landing institucional. */
  :root {
    --color-fondo: #05050a;
    --color-superficie: rgba(10, 15, 30, 0.6);
    --color-superficie-solida: #0c111e;
    --color-azul: #003366;
    --color-acento: #00a499;
    --color-acento-claro: #3fd5c8;
    --color-acento-texto: #3fd5c8;
    --color-sobre-acento: #021613;
    --color-texto: #ffffff;
    --color-texto-suave: #a0aab5;
    --color-texto-tenue: #7d8794;
    --color-borde: rgba(0, 164, 153, 0.2);
    --color-borde-fuerte: rgba(160, 170, 181, 0.35);
    --color-foco: #3fe0d3;

    /* Semáforo: significado propio, nunca el acento. */
    --color-verde: #4ade80;
    --color-amarillo: #fbbf24;
    --color-rojo: #f87171;
    --color-gris: #4b5563;
    --color-sobre-semaforo: #05050a;

    --color-aviso: rgba(251, 191, 36, 0.12);
    --color-borde-aviso: rgba(251, 191, 36, 0.45);
    --color-error: rgba(248, 113, 113, 0.14);
    --color-borde-error: rgba(248, 113, 113, 0.55);
    --color-exito: rgba(74, 222, 128, 0.1);
    --color-borde-exito: rgba(74, 222, 128, 0.45);

    --transicion: 160ms ease-out;
    --fuente: 'Outfit', 'Avenir Next', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;

    --texto-xs: 0.8125rem;
    --texto-sm: 0.9375rem;
    --texto-base: 1.0625rem;
    --texto-md: 1.3125rem;
    --texto-lg: 1.625rem;
    --texto-xl: 2.0625rem;
    --interlineado: 1.5;
    --interlineado-titulo: 1.15;

    --radio: 14px;
    --radio-chip: 999px;
    --espacio-1: 4px;
    --espacio-2: 8px;
    --espacio-3: 12px;
    --espacio-4: 16px;
    --espacio-5: 24px;
    --espacio-6: 32px;
    --espacio-7: 48px;
    --alto-tactil: 44px;
    --alto-tactil-grande: 56px;

    --vidrio-desenfoque: blur(14px);
    --resplandor: 0 0 32px rgba(0, 164, 153, 0.35);
    --degradado-marca: radial-gradient(120% 80% at 50% 0%, rgba(0, 51, 102, 0.85) 0%, rgba(5, 5, 10, 0) 70%);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--degradado-marca) no-repeat, var(--color-fondo);
    background-attachment: fixed;
    color: var(--color-texto);
    font-family: var(--fuente);
    font-size: var(--texto-base);
    line-height: var(--interlineado);
  }
  h1, h2, h3 { line-height: var(--interlineado-titulo); margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--color-foco); outline-offset: 2px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  /* --- Estructura ------------------------------------------------------------------- */
  .cabecera {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: var(--espacio-3);
    padding: var(--espacio-3) var(--espacio-4);
    background: var(--color-superficie);
    backdrop-filter: var(--vidrio-desenfoque); -webkit-backdrop-filter: var(--vidrio-desenfoque);
    border-bottom: 1px solid var(--color-borde);
  }
  .marca { display: flex; flex-direction: column; }
  .marca__rotulo {
    font-size: var(--texto-xs); font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--color-acento-texto);
  }
  .marca__nombre { font-size: var(--texto-md); font-weight: 800; }
  .chip-semestre {
    font-size: var(--texto-xs); color: var(--color-texto-suave);
    border: 1px solid var(--color-borde-fuerte); border-radius: var(--radio-chip);
    padding: var(--espacio-1) var(--espacio-3); white-space: nowrap;
  }

  .marco { width: 100%; max-width: 80rem; margin: 0 auto; padding: var(--espacio-4); }
  .lateral { display: none; }

  /* Avance del teléfono: "Paso N de 6" y seis tramos. */
  .avance-movil { margin-bottom: var(--espacio-5); }
  .avance-movil__texto { font-size: var(--texto-sm); color: var(--color-texto-suave); margin-bottom: var(--espacio-2); }
  .tramos { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--espacio-1); }
  .tramo { height: 6px; border-radius: 3px; border: 1px solid var(--color-borde-fuerte); }
  .tramo--hecho { background: var(--color-acento); border-color: var(--color-acento); }
  .tramo--actual { background: var(--color-acento-claro); border-color: var(--color-acento-claro); height: 8px; box-shadow: var(--resplandor); }

  .paso__titulo { font-size: var(--texto-lg); font-weight: 800; margin-bottom: var(--espacio-2); }
  .paso__ayuda { color: var(--color-texto-suave); margin: 0 0 var(--espacio-5); }

  @media (min-width: 64rem) {
    .marco {
      display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: var(--espacio-7);
      padding: var(--espacio-6) var(--espacio-6) var(--espacio-7);
    }
    .lateral { display: block; position: sticky; top: 6rem; align-self: start; }
    .avance-movil { display: none; }
    .paso__titulo { font-size: var(--texto-xl); }
  }

  .pasos-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--espacio-2); }
  .pasos-lista__item {
    display: flex; align-items: center; gap: var(--espacio-3);
    padding: var(--espacio-3); border-radius: var(--radio); color: var(--color-texto-suave);
  }
  .pasos-lista__marca {
    width: 28px; height: 28px; flex: none; border-radius: 50%;
    display: grid; place-items: center; font-size: var(--texto-sm); font-weight: 600;
    border: 1.5px solid var(--color-borde-fuerte);
  }
  .pasos-lista__item--hecho .pasos-lista__marca { background: var(--color-acento); border-color: var(--color-acento); color: var(--color-sobre-acento); }
  .pasos-lista__item--actual { background: var(--color-superficie); border: 1px solid var(--color-borde); color: var(--color-texto); font-weight: 600; }
  .pasos-lista__item--actual .pasos-lista__marca { border-color: var(--color-acento-claro); color: var(--color-acento-claro); box-shadow: var(--resplandor); }
  .pasos-lista__opcional { display: block; font-size: var(--texto-xs); font-weight: 400; color: var(--color-texto-tenue); }

  /* --- Tarjetas y campos ------------------------------------------------------------ */
  .tarjeta {
    background: var(--color-superficie-solida); border: 1px solid var(--color-borde);
    border-radius: var(--radio); padding: var(--espacio-5);
  }
  .rejilla-2 { display: grid; gap: var(--espacio-4); }
  @media (min-width: 48rem) { .rejilla-2 { grid-template-columns: 1fr 1fr; } }
  .rejilla-2--siempre { gap: var(--espacio-3); margin-top: var(--espacio-2); }
  @media (min-width: 30rem) { .rejilla-2--siempre { grid-template-columns: 1fr 1fr; } }
  /* Consultas y compromisos: lado a lado solo con espacio de sobra. */
  @media (min-width: 48rem) and (max-width: 79.99rem) { .rejilla-2--ancha { grid-template-columns: 1fr; } }
  .rejilla-2--ancha { gap: var(--espacio-6); align-items: start; }
  .tarjeta__titulo { margin: 0 0 var(--espacio-2); }
  .separador { height: 1px; background: var(--color-borde); margin: var(--espacio-5) 0; }

  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend, .rotulo {
    font-size: var(--texto-xs); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--color-acento-texto); margin-bottom: var(--espacio-3); padding: 0;
  }
  .campo { display: flex; flex-direction: column; gap: var(--espacio-1); margin-bottom: var(--espacio-3); }
  .campo label, .campo__rotulo { font-size: var(--texto-sm); font-weight: 600; }
  .campo__rotulo { display: block; margin-bottom: var(--espacio-2); }
  .entrada, select.entrada, textarea.entrada {
    min-height: var(--alto-tactil-grande); padding: var(--espacio-3) var(--espacio-4);
    background: var(--color-fondo); border: 1.5px solid var(--color-borde-fuerte); border-radius: 10px;
    transition: border-color var(--transicion);
  }
  .entrada::placeholder { color: var(--color-texto-tenue); }
  .entrada:focus { border-color: var(--color-foco); outline: none; box-shadow: 0 0 0 3px rgba(63, 224, 211, 0.25); }
  textarea.entrada { min-height: 14rem; resize: vertical; line-height: var(--interlineado); }
  textarea.entrada--corta { min-height: 4.5rem; }
  .texto-apoyo { font-size: var(--texto-xs); color: var(--color-texto-suave); }

  /* --- Botones (tres niveles) ------------------------------------------------------- */
  .boton {
    min-height: var(--alto-tactil); padding: var(--espacio-2) var(--espacio-5);
    border-radius: var(--radio-chip); border: 1.5px solid transparent; cursor: pointer;
    font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: var(--espacio-2);
    text-decoration: none; transition: background var(--transicion), border-color var(--transicion);
  }
  .boton:disabled { opacity: 0.5; cursor: not-allowed; }
  .boton--primario { background: var(--color-acento); color: var(--color-sobre-acento); }
  .boton--primario:hover:not(:disabled) { background: var(--color-acento-claro); }
  .boton--secundario { background: transparent; border-color: var(--color-acento); color: var(--color-acento-texto); }
  .boton--secundario:hover:not(:disabled) { background: rgba(0, 164, 153, 0.12); }
  .boton--neutro { background: transparent; border-color: var(--color-borde-fuerte); color: var(--color-texto); }
  .boton--neutro:hover:not(:disabled) { border-color: var(--color-texto-suave); }
  .boton--chico { min-height: 36px; padding: var(--espacio-1) var(--espacio-4); font-size: var(--texto-sm); }

  .acciones {
    display: flex; flex-wrap: wrap; gap: var(--espacio-3); justify-content: space-between; align-items: center;
    margin-top: var(--espacio-5);
  }
  .acciones--fijas {
    position: sticky; bottom: 0; z-index: 5; margin: var(--espacio-5) calc(-1 * var(--espacio-4)) 0;
    padding: var(--espacio-3) var(--espacio-4);
    background: rgba(5, 5, 10, 0.92); border-top: 1px solid var(--color-borde);
  }
  @media (min-width: 64rem) { .acciones--fijas { margin-left: 0; margin-right: 0; border-radius: var(--radio); border: 1px solid var(--color-borde); } }
  .acciones__estado { color: var(--color-texto-suave); font-size: var(--texto-sm); }

  /* --- Paso 2: equipos e hitos ------------------------------------------------------ */
  .equipos { display: grid; gap: var(--espacio-3); grid-template-columns: 1fr; margin: var(--espacio-4) 0; }
  @media (min-width: 40rem) { .equipos { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 80rem) { .equipos { grid-template-columns: repeat(3, 1fr); } }
  .opcion-equipo {
    text-align: left; padding: var(--espacio-4); min-height: var(--alto-tactil-grande); cursor: pointer;
    background: var(--color-fondo); border: 1.5px solid var(--color-borde-fuerte); border-radius: var(--radio);
    display: flex; flex-direction: column; gap: var(--espacio-1);
  }
  .opcion-equipo:hover { border-color: var(--color-texto-suave); }
  .opcion-equipo[aria-pressed="true"] { border-color: var(--color-texto); box-shadow: inset 0 0 0 1px var(--color-texto); }
  .opcion-equipo__numero { font-weight: 800; }
  .opcion-equipo__curso { font-size: var(--texto-xs); color: var(--color-texto-suave); }
  .chips { display: flex; flex-wrap: wrap; gap: var(--espacio-2); }
  .chip {
    min-height: var(--alto-tactil); padding: var(--espacio-2) var(--espacio-4); cursor: pointer;
    border-radius: var(--radio-chip); background: var(--color-fondo); border: 1.5px solid var(--color-borde-fuerte);
  }
  .chip[aria-pressed="true"] { border-color: var(--color-texto); background: rgba(255, 255, 255, 0.08); font-weight: 600; }
  .chip__fecha { color: var(--color-texto-suave); font-size: var(--texto-xs); margin-left: var(--espacio-1); }
  .chip--fijo { display: inline-flex; align-items: center; gap: var(--espacio-2); cursor: default; padding-right: var(--espacio-1); }
  .chip__quitar {
    width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
    background: transparent; color: var(--color-texto-suave);
  }
  .chip__quitar:hover { background: rgba(255, 255, 255, 0.08); color: var(--color-texto); }
  .chips--agregados { margin-top: var(--espacio-3); }

  .barra-dupla {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--espacio-3);
    padding: var(--espacio-3) var(--espacio-4); margin-bottom: var(--espacio-4);
    background: var(--color-superficie-solida); border: 1px solid var(--color-borde); border-radius: var(--radio);
  }
  .barra-dupla .rotulo { margin: 0 var(--espacio-2) 0 0; }

  /* Integrantes presentes: casillas grandes, dos columnas en computador. */
  .casillas { display: grid; gap: var(--espacio-2); }
  @media (min-width: 40rem) { .casillas { grid-template-columns: 1fr 1fr; } }
  .casilla {
    display: flex; align-items: center; gap: var(--espacio-3); cursor: pointer;
    min-height: var(--alto-tactil-grande); padding: var(--espacio-2) var(--espacio-4);
    background: var(--color-fondo); border: 1.5px solid var(--color-borde-fuerte); border-radius: 10px;
  }
  .casilla:has(input:checked) { border-color: var(--color-texto); box-shadow: inset 0 0 0 1px var(--color-texto); font-weight: 600; }
  .casilla input { width: 22px; height: 22px; accent-color: var(--color-acento); flex: none; margin: 0; }
  .agregar-integrante__titulo { margin-top: var(--espacio-5); }
  .agregar-integrante { display: grid; gap: var(--espacio-3); align-items: end; }
  .agregar-integrante .campo { margin: 0; }
  @media (min-width: 40rem) { .agregar-integrante { grid-template-columns: 1fr 1fr auto; } }
  .agregar-integrante .boton { min-height: var(--alto-tactil-grande); }

  /* --- Paso 3: preguntas ------------------------------------------------------------ */
  .dimension { margin-bottom: var(--espacio-6); }
  .dimension__cabecera { display: flex; align-items: baseline; justify-content: space-between; gap: var(--espacio-3); margin-bottom: var(--espacio-3); }
  .dimension__titulo { font-size: var(--texto-md); font-weight: 600; }
  .dimension__codigo { color: var(--color-acento-texto); font-weight: 800; margin-right: var(--espacio-2); }
  .dimension__cuenta { font-size: var(--texto-sm); color: var(--color-texto-suave); white-space: nowrap; }
  .preguntas { display: grid; gap: var(--espacio-4); }
  @media (min-width: 64rem) { .preguntas { grid-template-columns: 1fr 1fr; } }
  .pregunta { background: var(--color-superficie-solida); border: 1px solid var(--color-borde-fuerte); border-radius: var(--radio); padding: var(--espacio-4); }
  .pregunta__texto { font-weight: 600; margin: 0 0 var(--espacio-3); }
  .alternativas { display: grid; gap: var(--espacio-2); }
  .alternativa {
    display: flex; align-items: center; gap: var(--espacio-3); text-align: left; cursor: pointer;
    min-height: var(--alto-tactil-grande); padding: var(--espacio-2) var(--espacio-4);
    background: var(--color-fondo); border: 1.5px solid var(--color-borde-fuerte); border-radius: 10px;
  }
  .alternativa:hover { border-color: var(--color-texto-suave); }
  .alternativa[aria-pressed="true"] { border-color: var(--color-texto); box-shadow: inset 0 0 0 1px var(--color-texto); font-weight: 600; }
  .alternativa--otro { border-style: dashed; color: var(--color-texto-suave); }
  .otro { display: grid; gap: var(--espacio-2); margin-top: var(--espacio-3); }
  .otro__fila { display: flex; gap: var(--espacio-2); align-items: center; }
  .otro__fila select { flex: 1; }
  .nota { margin: var(--espacio-3) 0 0; }

  /* --- Pasos 4 y 5: pares de texto libre ------------------------------------------- */
  .seccion__titulo { font-size: var(--texto-md); font-weight: 600; margin-bottom: var(--espacio-4); }
  .lista-pares { display: grid; gap: var(--espacio-4); justify-items: start; }
  .lista-pares > .par { justify-self: stretch; }
  .par { background: var(--color-superficie-solida); border: 1px solid var(--color-borde-fuerte); border-radius: var(--radio); padding: var(--espacio-4); }
  .par__cabecera { display: flex; align-items: center; justify-content: space-between; gap: var(--espacio-3); margin-bottom: var(--espacio-2); }
  .par__cabecera .rotulo { margin: 0; }

  /* Punto del semáforo con glifo: el estado no depende solo del color. */
  .punto {
    width: 22px; height: 22px; flex: none; border-radius: 50%; display: inline-grid; place-items: center;
    font-size: 13px; font-weight: 800; color: var(--color-sobre-semaforo); background: var(--color-gris);
  }
  .punto--verde { background: var(--color-verde); }
  .punto--verde::after { content: "✓"; }
  .punto--amarillo { background: var(--color-amarillo); }
  .punto--amarillo::after { content: "!"; }
  .punto--rojo { background: var(--color-rojo); }
  .punto--rojo::after { content: "✕"; }
  .punto--sin::after { content: "–"; color: var(--color-texto); }

  /* --- Paso 6: semáforo y acta ------------------------------------------------------ */
  .semaforo { display: grid; gap: var(--espacio-3); grid-template-columns: 1fr; margin-bottom: var(--espacio-6); }
  @media (min-width: 40rem) { .semaforo { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 80rem) { .semaforo { grid-template-columns: repeat(3, 1fr); } }
  .semaforo__item {
    display: flex; align-items: center; gap: var(--espacio-3); padding: var(--espacio-4);
    background: var(--color-superficie-solida); border: 1px solid var(--color-borde-fuerte); border-radius: var(--radio);
    border-left-width: 6px;
  }
  .semaforo__item--verde { border-left-color: var(--color-verde); }
  .semaforo__item--amarillo { border-left-color: var(--color-amarillo); }
  .semaforo__item--rojo { border-left-color: var(--color-rojo); }
  .semaforo__nombre { font-weight: 600; }
  .semaforo__estado { font-size: var(--texto-sm); color: var(--color-texto-suave); }
  .semaforo__item .punto { width: 32px; height: 32px; font-size: 16px; }

  .revision { display: grid; gap: var(--espacio-5); }
  @media (min-width: 64rem) { .revision { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: start; } }
  .vista-previa {
    background: var(--color-superficie); backdrop-filter: var(--vidrio-desenfoque); -webkit-backdrop-filter: var(--vidrio-desenfoque);
    border: 1px solid var(--color-borde); border-radius: var(--radio); padding: var(--espacio-5); box-shadow: var(--resplandor);
    font-size: var(--texto-sm);
  }
  @media (min-width: 64rem) { .vista-previa { max-height: calc(100vh - 9rem); overflow: auto; position: sticky; top: 6rem; } }
  .vista-previa h3 { font-size: var(--texto-base); color: var(--color-acento-texto); margin: var(--espacio-5) 0 var(--espacio-2); }
  .vista-previa__titulo { font-size: var(--texto-md); font-weight: 800; }
  .vista-previa table { width: 100%; border-collapse: collapse; margin-bottom: var(--espacio-3); }
  .vista-previa td { border: 1px solid var(--color-borde-fuerte); padding: var(--espacio-2); vertical-align: top; }
  .vista-previa td:first-child { font-weight: 600; width: 40%; }
  .vista-previa tr.encabezado td { font-weight: 600; background: rgba(255, 255, 255, 0.04); }
  .vista-previa ul { margin: 0; padding-left: 1.25rem; }
  .vista-previa__editable { outline: 1px dashed var(--color-acento); outline-offset: 4px; border-radius: 4px; }

  /* --- Estados ---------------------------------------------------------------------- */
  .aviso {
    display: flex; gap: var(--espacio-3); align-items: flex-start; padding: var(--espacio-3) var(--espacio-4);
    border-radius: 10px; border: 1px solid; margin: var(--espacio-4) 0; font-size: var(--texto-sm);
  }
  .aviso::before { font-weight: 800; flex: none; }
  .aviso--error { background: var(--color-error); border-color: var(--color-borde-error); }
  .aviso--error::before { content: "✕"; color: var(--color-rojo); }
  .aviso--exito { background: var(--color-exito); border-color: var(--color-borde-exito); }
  .aviso--exito::before { content: "✓"; color: var(--color-verde); }
  .aviso--info { background: var(--color-aviso); border-color: var(--color-borde-aviso); }
  .aviso--info::before { content: "!"; color: var(--color-amarillo); }
  .cargando { display: flex; align-items: center; gap: var(--espacio-3); color: var(--color-texto-suave); padding: var(--espacio-5) 0; }
  .giro {
    width: 22px; height: 22px; border-radius: 50%; flex: none;
    border: 3px solid var(--color-borde-fuerte); border-top-color: var(--color-acento-claro);
    animation: giro 0.9s linear infinite;
  }
  @keyframes giro { to { transform: rotate(360deg); } }
  .marca-modelo { font-size: var(--texto-xs); color: var(--color-texto-suave); margin-top: var(--espacio-1); }
</style>
