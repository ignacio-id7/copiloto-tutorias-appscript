<script>
  // JavaScript del navegador. Habla con Codigo.gs por google.script.run; el estado del
  // registro vive en `estado` y cada paso se dibuja de nuevo con pintar().

  var PASOS = ['Quiénes', 'Equipo e hito', 'Preguntas', 'Preguntas del tutor', 'Consultas y compromisos', 'Semáforo y acta'];
  var PASO_ACTA = 6;
  var ETIQUETA_COLOR = { verde: 'Verde', amarillo: 'Amarillo', rojo: 'Rojo' };
  var ETIQUETA_RESPONSABLE = { equipo: 'Equipo', tutores: 'Tutores' };
  var CLAVE_TUTORES = 'copiloto.tutores';
  var OTRO_TUTOR = '__otro__';
  var MAXIMO_RESPUESTA_PROPIA = 300;
  var MAXIMO_NOTA = 500;
  var MAXIMO_TEXTO_LIBRE = 1000;

  var datos = null;
  var estado = null;

  function estadoInicial(tutores) {
    return {
      paso: 1,
      conduce: tutores.conduce,
      registra: tutores.registra,
      equipoNumero: null,
      hitoNumero: null,
      filtro: '',
      verTodos: false,
      presentes: [],
      otrosIntegrantes: [],
      nuevoIntegrante: { nombre: '', apellido: '' },
      respuestas: {},
      preguntasTutor: [],
      consultas: [],
      compromisos: [],
      descartadas: 0,
      tutoriaId: null,
      semaforo: null,
      acta: null,
      fase: 'inicio', // inicio | generando | borrador | aprobando | aprobada
      observaciones: '',
      documento: null,
      error: ''
    };
  }

  // --- Utilidades ---------------------------------------------------------------------------

  function llamar(nombre) {
    var argumentos = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolver, rechazar) {
      var corredor = google.script.run.withSuccessHandler(resolver).withFailureHandler(rechazar);
      corredor[nombre].apply(corredor, argumentos);
    });
  }

  function escapar(texto) {
    return String(texto == null ? '' : texto)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function mensajeDe(error) {
    return (error && error.message ? error.message : String(error)).replace(/^Error:\s*/, '');
  }

  function claveNombre(texto) {
    return String(texto || '').replace(/\s+/g, ' ').trim().toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function vacio(texto) {
    return !String(texto || '').trim();
  }

  // --- Tutores ------------------------------------------------------------------------------

  function tutorPorAlias(alias) {
    return datos.tutores.filter(function (t) { return t.alias === alias; })[0] || null;
  }

  /** Lo recordado por este navegador, si los tutores siguen en la lista. */
  function leerTutoresRecordados() {
    var limpio = function (eleccion) {
      if (!eleccion) return { alias: '' };
      if (eleccion.otro) return { otro: true, nombre: eleccion.nombre || '', apellido: eleccion.apellido || '' };
      return { alias: eleccion.alias && tutorPorAlias(eleccion.alias) ? eleccion.alias : '' };
    };
    try {
      var guardado = JSON.parse(localStorage.getItem(CLAVE_TUTORES) || 'null');
      if (guardado) return { conduce: limpio(guardado.conduce), registra: limpio(guardado.registra) };
    } catch (error) {}
    return { conduce: { alias: '' }, registra: { alias: '' } };
  }

  function recordarTutores() {
    try {
      localStorage.setItem(CLAVE_TUTORES, JSON.stringify({ conduce: estado.conduce, registra: estado.registra }));
    } catch (error) {}
  }

  function nombreDeEleccion(eleccion) {
    if (eleccion.otro) return (eleccion.nombre + ' ' + eleccion.apellido).replace(/\s+/g, ' ').trim();
    var tutor = tutorPorAlias(eleccion.alias);
    return tutor ? tutor.nombre : '';
  }

  /** La dupla registrada de los dos tutores elegidos, o null. */
  function duplaDeLosTutores() {
    if (estado.conduce.otro || estado.registra.otro) return null;
    var a = tutorPorAlias(estado.conduce.alias);
    var b = tutorPorAlias(estado.registra.alias);
    if (!a || !b) return null;
    return datos.duplasPorPar[[a.clave, b.clave].sort().join('|')] || null;
  }

  // --- Equipo, hito y guion -----------------------------------------------------------------

  function equipoElegido() {
    return datos.equipos.filter(function (e) { return e.numero === estado.equipoNumero; })[0] || null;
  }

  function hitosDelEquipo(equipo) {
    return equipo && datos.hitosPorCurso[equipo.curso] ? datos.hitosPorCurso[equipo.curso].hitos : [];
  }

  function hitoElegido() {
    return hitosDelEquipo(equipoElegido()).filter(function (h) { return h.numero === estado.hitoNumero; })[0] || null;
  }

  function guion() {
    var equipo = equipoElegido();
    if (!equipo || estado.hitoNumero === null) return [];
    return datos.guiones[equipo.curso + '|' + estado.hitoNumero] || [];
  }

  function respondida(clave) {
    var r = estado.respuestas[clave];
    if (!r) return false;
    return r.otro ? Boolean(r.texto.trim() && r.color) : true;
  }

  function aprobada() {
    return estado.fase === 'aprobada';
  }

  // --- Navegación ---------------------------------------------------------------------------

  function pintarNavegacion() {
    document.getElementById('pasos-lista').innerHTML = PASOS.map(function (nombre, i) {
      var numero = i + 1;
      var clase = numero < estado.paso ? 'hecho' : numero === estado.paso ? 'actual' : 'pendiente';
      var marca = numero < estado.paso ? '✓' : String(numero);
      var opcional = numero === 4 || numero === 5 ? '<span class="pasos-lista__opcional">Opcional</span>' : '';
      return '<li class="pasos-lista__item pasos-lista__item--' + clase + '"' +
        (numero === estado.paso ? ' aria-current="step"' : '') + '>' +
        '<span class="pasos-lista__marca" aria-hidden="true">' + marca + '</span><span>' + escapar(nombre) + opcional + '</span></li>';
    }).join('');
    document.getElementById('avance-texto').textContent =
      'Paso ' + estado.paso + ' de ' + PASOS.length + ' · ' + PASOS[estado.paso - 1];
    document.getElementById('tramos').innerHTML = PASOS.map(function (_, i) {
      var numero = i + 1;
      var clase = numero < estado.paso ? 'tramo--hecho' : numero === estado.paso ? 'tramo--actual' : '';
      return '<span class="tramo ' + clase + '"></span>';
    }).join('');
  }

  function irA(paso) {
    estado.paso = paso;
    estado.error = '';
    pintar();
    window.scrollTo(0, 0);
    document.getElementById('principal').focus({ preventScroll: true });
  }

  function pintar() {
    pintarNavegacion();
    var contenido = document.getElementById('contenido');
    contenido.innerHTML = [null, htmlPaso1, htmlPaso2, htmlPaso3, htmlPaso4, htmlPaso5, htmlPaso6][estado.paso]();
    if (estado.paso === 2) pintarEquipos();
    if (estado.paso === 3) actualizarCuentas();
  }

  function htmlError() {
    return estado.error ? '<div class="aviso aviso--error" role="alert">' + escapar(estado.error) + '</div>' : '';
  }

  // --- Paso 1: quiénes ----------------------------------------------------------------------

  function htmlTutor(rol, titulo) {
    var eleccion = estado[rol];
    var valor = eleccion.otro ? OTRO_TUTOR : eleccion.alias;
    var html = '<div class="tarjeta"><div class="campo"><label class="rotulo" for="' + rol + '-tutor">' + titulo + '</label>' +
      '<select class="entrada" id="' + rol + '-tutor" data-tutor="' + rol + '">' +
      '<option value=""' + (valor ? '' : ' selected') + '>Elige un tutor</option>' +
      datos.tutores.map(function (t) {
        return '<option value="' + escapar(t.alias) + '"' + (valor === t.alias ? ' selected' : '') + '>' + escapar(t.nombre) + '</option>';
      }).join('') +
      '<option value="' + OTRO_TUTOR + '"' + (valor === OTRO_TUTOR ? ' selected' : '') + '>No está en la lista</option>' +
      '</select></div>';
    if (eleccion.otro) {
      html += '<div class="rejilla-2 rejilla-2--siempre">' +
        '<div class="campo"><label for="' + rol + '-nombre">Nombre</label>' +
        '<input class="entrada" id="' + rol + '-nombre" data-rol="' + rol + '" data-parte="nombre" autocomplete="off" maxlength="120" value="' + escapar(eleccion.nombre) + '"></div>' +
        '<div class="campo"><label for="' + rol + '-apellido">Apellido</label>' +
        '<input class="entrada" id="' + rol + '-apellido" data-rol="' + rol + '" data-parte="apellido" autocomplete="off" maxlength="120" value="' + escapar(eleccion.apellido) + '"></div></div>';
    }
    return html + '</div>';
  }

  function htmlPaso1() {
    var html = '<form id="form-paso1" novalidate>' +
      '<h1 class="paso__titulo">¿Quiénes hacen la tutoría?</h1>' +
      '<p class="paso__ayuda">Elige a los dos tutores; este navegador los recuerda para la próxima vez</p>';
    if (!datos.tutores.length) {
      html += '<div class="aviso aviso--info">La pestaña Tutores de la planilla está vacía. Puedes escribir los nombres a mano con "No está en la lista".</div>';
    }
    return html + '<div class="rejilla-2">' + htmlTutor('conduce', 'Conduce la reunión') + htmlTutor('registra', 'Toma notas') + '</div>' +
      htmlError() +
      '<div class="acciones"><span></span><button type="submit" class="boton boton--primario">Siguiente</button></div>' +
      '</form>';
  }

  function validarPaso1() {
    var roles = ['conduce', 'registra'];
    for (var i = 0; i < roles.length; i++) {
      var eleccion = estado[roles[i]];
      if (eleccion.otro ? vacio(eleccion.nombre) || vacio(eleccion.apellido) : !eleccion.alias) {
        return 'Elige a los dos tutores (o escribe nombre y apellido si no están en la lista).';
      }
    }
    var mismo = !estado.conduce.otro && !estado.registra.otro
      ? estado.conduce.alias === estado.registra.alias
      : claveNombre(nombreDeEleccion(estado.conduce)) === claveNombre(nombreDeEleccion(estado.registra));
    return mismo ? 'Quien conduce y quien toma notas deben ser personas distintas.' : '';
  }

  // --- Paso 2: equipo, hito e integrantes ---------------------------------------------------

  function equiposVisibles() {
    var dupla = duplaDeLosTutores();
    var base = dupla && !estado.verTodos
      ? datos.equipos.filter(function (e) { return dupla.equipos.indexOf(e.numero) !== -1; })
      : datos.equipos;
    var filtro = estado.filtro.trim().toLowerCase();
    return base.filter(function (e) {
      return !filtro || String(e.numero) === filtro || (e.numero + ' ' + e.nombre + ' ' + e.curso).toLowerCase().indexOf(filtro) !== -1;
    });
  }

  function htmlDupla() {
    var dupla = duplaDeLosTutores();
    if (!dupla) {
      return '<div class="aviso aviso--info">' + escapar(nombreDeEleccion(estado.conduce)) + ' y ' +
        escapar(nombreDeEleccion(estado.registra)) + ' no forman una dupla registrada en la pestaña Duplas: se muestran todos los equipos.</div>';
    }
    return '<div class="barra-dupla"><span><span class="rotulo">Dupla</span><strong>' + escapar(dupla.dupla) + '</strong>' +
      (estado.verTodos ? ' · todos los equipos' : ' · ' + dupla.equipos.length + ' equipo(s)') + '</span>' +
      '<button type="button" class="boton boton--neutro boton--chico" id="ver-todos">' +
      (estado.verTodos ? 'Ver solo los de la dupla' : 'Ver todos los equipos') + '</button></div>';
  }

  function htmlIntegrantes(equipo) {
    var html = '<span class="rotulo">Integrantes presentes</span>';
    if (equipo.integrantes.length) {
      html += '<div class="casillas">' + equipo.integrantes.map(function (nombre, i) {
        var marcado = estado.presentes.indexOf(nombre) !== -1;
        return '<label class="casilla"><input type="checkbox" data-integrante="' + i + '"' + (marcado ? ' checked' : '') + '><span>' + escapar(nombre) + '</span></label>';
      }).join('') + '</div>';
    } else {
      html += '<p class="texto-apoyo">La pestaña Equipos no tiene integrantes para este equipo. Agrégalos abajo.</p>';
    }
    if (estado.otrosIntegrantes.length) {
      html += '<div class="chips chips--agregados">' + estado.otrosIntegrantes.map(function (otro, i) {
        return '<span class="chip chip--fijo">' + escapar(otro.nombre + ' ' + otro.apellido) +
          '<button type="button" class="chip__quitar" data-quitar-integrante="' + i + '" aria-label="Quitar a ' + escapar(otro.nombre + ' ' + otro.apellido) + '">✕</button></span>';
      }).join('') + '</div>';
    }
    return html + '<span class="campo__rotulo agregar-integrante__titulo">Agregar otro (no está en la lista)</span>' +
      '<div class="agregar-integrante">' +
      '<div class="campo"><label for="nuevo-nombre">Nombre</label>' +
      '<input class="entrada" id="nuevo-nombre" data-nuevo="nombre" autocomplete="off" maxlength="120" value="' + escapar(estado.nuevoIntegrante.nombre) + '"></div>' +
      '<div class="campo"><label for="nuevo-apellido">Apellido</label>' +
      '<input class="entrada" id="nuevo-apellido" data-nuevo="apellido" autocomplete="off" maxlength="120" value="' + escapar(estado.nuevoIntegrante.apellido) + '"></div>' +
      '<button type="button" class="boton boton--secundario" id="agregar-integrante">Agregar</button></div>';
  }

  function htmlPaso2() {
    var equipo = equipoElegido();
    var html = '<h1 class="paso__titulo">¿Qué equipo y qué hito?</h1>' +
      '<p class="paso__ayuda">Los equipos, los hitos y los integrantes salen de la planilla de Impulsa</p>' +
      htmlDupla() +
      '<div class="campo"><label for="filtro-equipos">Buscar equipo</label>' +
      '<input class="entrada" id="filtro-equipos" type="search" placeholder="Número o nombre del proyecto" value="' + escapar(estado.filtro) + '"></div>' +
      '<div class="equipos" id="equipos" role="group" aria-label="Equipos"></div>';
    if (equipo) {
      var dupla = duplaDeLosTutores();
      var deOtraDupla = dupla && equipo.dupla && claveNombre(equipo.dupla) !== claveNombre(dupla.dupla);
      html += '<div class="tarjeta"><span class="rotulo">Equipo ' + equipo.numero + '</span>' +
        '<p class="tarjeta__titulo"><strong>' + escapar(equipo.nombre) + '</strong> · ' + escapar(equipo.curso) +
        (equipo.dupla ? ' · dupla ' + escapar(equipo.dupla) : '') + '</p>' +
        (deOtraDupla ? '<p class="texto-apoyo">Este equipo es de otra dupla: la tutoría queda registrada con la dupla del equipo.</p>' : '') +
        '<span class="rotulo">Hito en curso</span><div class="chips" role="group" aria-label="Hito">' +
        hitosDelEquipo(equipo).map(function (h) {
          return '<button type="button" class="chip" data-hito="' + h.numero + '" aria-pressed="' + (h.numero === estado.hitoNumero) + '">' +
            escapar(h.nombre) + (h.fecha ? '<span class="chip__fecha">' + escapar(h.fecha) + '</span>' : '') + '</button>';
        }).join('') + '</div>' +
        '<div class="separador"></div>' + htmlIntegrantes(equipo) + '</div>';
    }
    if (estado.tutoriaId && !aprobada()) {
      html += '<div class="aviso aviso--info">Esta tutoría ya está guardada. Si cambias algo, al guardar de nuevo se reemplaza la misma fila de la planilla.</div>';
    }
    return html + htmlError() +
      '<div class="acciones"><button type="button" class="boton boton--neutro" data-ir="1">Atrás</button>' +
      '<button type="button" class="boton boton--primario" id="siguiente-2"' + (equipo && hitoElegido() ? '' : ' disabled') + '>Siguiente</button></div>';
  }

  function pintarEquipos() {
    var contenedor = document.getElementById('equipos');
    if (!datos.equipos.length) {
      contenedor.innerHTML = '<div class="aviso aviso--info">La pestaña Equipos de la planilla no tiene equipos activos.</div>';
      return;
    }
    var visibles = equiposVisibles();
    contenedor.innerHTML = visibles.length ? visibles.map(function (e) {
      return '<button type="button" class="opcion-equipo" data-equipo="' + e.numero + '" aria-pressed="' + (e.numero === estado.equipoNumero) + '">' +
        '<span class="opcion-equipo__numero">Equipo ' + e.numero + '</span><span>' + escapar(e.nombre) + '</span>' +
        '<span class="opcion-equipo__curso">' + escapar(e.curso) + (e.dupla ? ' · ' + escapar(e.dupla) : '') + '</span></button>';
    }).join('') : '<p class="texto-apoyo">Ningún equipo coincide con la búsqueda.</p>';
  }

  function elegirEquipo(numero) {
    if (numero !== estado.equipoNumero) {
      estado.presentes = [];
      estado.otrosIntegrantes = [];
    }
    estado.equipoNumero = numero;
    var equipo = equipoElegido();
    var vigente = hitosDelEquipo(equipo).some(function (h) { return h.numero === estado.hitoNumero; });
    if (!vigente) estado.hitoNumero = datos.hitosPorCurso[equipo.curso] ? datos.hitosPorCurso[equipo.curso].sugerido : null;
    pintar();
  }

  function agregarIntegrante() {
    var nuevo = estado.nuevoIntegrante;
    if (vacio(nuevo.nombre) || vacio(nuevo.apellido)) {
      estado.error = 'Escribe nombre y apellido del integrante que quieres agregar.';
      pintar();
      return;
    }
    estado.otrosIntegrantes.push({ nombre: nuevo.nombre.trim(), apellido: nuevo.apellido.trim() });
    estado.nuevoIntegrante = { nombre: '', apellido: '' };
    estado.error = '';
    pintar();
    document.getElementById('nuevo-nombre').focus();
  }

  /** Al pasar al paso 3, se quitan las respuestas que no están en el guion nuevo. */
  function ajustarRespuestasAlGuion() {
    var claves = guion().map(function (p) { return p.clave; });
    var quitadas = 0;
    Object.keys(estado.respuestas).forEach(function (clave) {
      if (claves.indexOf(clave) === -1) {
        delete estado.respuestas[clave];
        quitadas++;
      }
    });
    estado.descartadas = quitadas;
  }

  // --- Paso 3: preguntas --------------------------------------------------------------------

  function htmlPregunta(pregunta) {
    var r = estado.respuestas[pregunta.clave];
    var bloqueo = aprobada() ? ' disabled' : '';
    var html = '<article class="pregunta" id="pregunta-' + escapar(pregunta.clave) + '">' +
      '<p class="pregunta__texto">' + escapar(pregunta.texto) + '</p><div class="alternativas">';
    pregunta.alternativas.forEach(function (alternativa, indice) {
      var elegida = r && !r.otro && r.indice === indice;
      html += '<button type="button" class="alternativa" data-clave="' + escapar(pregunta.clave) + '" data-indice="' + indice + '" aria-pressed="' + elegida + '"' + bloqueo + '>' +
        '<span class="punto punto--' + alternativa.color + '" aria-hidden="true"></span>' +
        '<span>' + escapar(alternativa.texto) + '<span class="texto-apoyo"> · ' + ETIQUETA_COLOR[alternativa.color] + '</span></span></button>';
    });
    html += '<button type="button" class="alternativa alternativa--otro" data-clave="' + escapar(pregunta.clave) + '" data-otro="1" aria-pressed="' + Boolean(r && r.otro) + '"' + bloqueo + '>' +
      '<span class="punto punto--sin" aria-hidden="true"></span><span>Otro</span></button></div>';
    if (r && r.otro) {
      var id = 'otro-' + pregunta.clave;
      html += '<div class="otro"><div class="campo" style="margin:0"><label for="' + escapar(id) + '">Tu respuesta</label>' +
        '<input class="entrada" id="' + escapar(id) + '" data-otro-texto="' + escapar(pregunta.clave) + '" maxlength="' + MAXIMO_RESPUESTA_PROPIA + '" value="' + escapar(r.texto) + '"></div>' +
        '<div class="otro__fila"><span class="punto punto--' + (r.color || 'sin') + '" data-otro-punto="' + escapar(pregunta.clave) + '" aria-hidden="true"></span>' +
        '<select class="entrada" aria-label="Color del semáforo" data-otro-color="' + escapar(pregunta.clave) + '">' +
        '<option value="">Elegir color</option>' +
        ['verde', 'amarillo', 'rojo'].map(function (c) {
          return '<option value="' + c + '"' + (r.color === c ? ' selected' : '') + '>' + ETIQUETA_COLOR[c] + '</option>';
        }).join('') + '</select></div>' +
        '<span class="texto-apoyo">Con texto y color la pregunta queda respondida</span></div>';
    }
    if (r) {
      var idNota = 'nota-' + pregunta.clave;
      html += '<div class="campo nota"><label for="' + escapar(idNota) + '">Observación <span class="texto-apoyo">(opcional)</span></label>' +
        '<textarea class="entrada entrada--corta" id="' + escapar(idNota) + '" data-nota="' + escapar(pregunta.clave) + '" rows="2" maxlength="' + MAXIMO_NOTA + '">' + escapar(r.nota || '') + '</textarea></div>';
    }
    return html + '</article>';
  }

  function htmlPaso3() {
    var preguntas = guion();
    var equipo = equipoElegido();
    var hito = hitoElegido();
    var html = '<h1 class="paso__titulo">¿Cómo está el equipo?</h1>' +
      '<p class="paso__ayuda">Equipo ' + equipo.numero + ' · ' + escapar(equipo.nombre) + ' · ' + escapar(hito.nombre) +
      '. Toca una alternativa por pregunta; si no la conversaron, déjala sin responder</p>';
    if (estado.descartadas) {
      html += '<div class="aviso aviso--info">Se quitaron ' + estado.descartadas + ' respuesta(s) que no están en el guion de este equipo e hito.</div>';
    }
    if (!preguntas.length) {
      html += '<div class="aviso aviso--info">La pestaña Preguntas no tiene preguntas activas para ' + escapar(equipo.curso) + ' en ' + escapar(hito.nombre) + '. Puedes seguir igual.</div>';
    }
    datos.dimensiones.forEach(function (dimension) {
      var deLaDimension = preguntas.filter(function (p) { return p.dimension === dimension.codigo; });
      if (!deLaDimension.length) return;
      html += '<section class="dimension" aria-labelledby="dim-' + dimension.codigo + '">' +
        '<div class="dimension__cabecera"><h2 class="dimension__titulo" id="dim-' + dimension.codigo + '"><span class="dimension__codigo">' + dimension.codigo + '</span>' + escapar(dimension.nombre) + '</h2>' +
        '<span class="dimension__cuenta" data-cuenta="' + dimension.codigo + '"></span></div>' +
        '<div class="preguntas">' + deLaDimension.map(htmlPregunta).join('') + '</div></section>';
    });
    return html + htmlError() +
      '<div class="acciones acciones--fijas"><button type="button" class="boton boton--neutro" data-ir="2">Atrás</button>' +
      '<span class="acciones__estado" id="cuenta-total" aria-live="polite"></span>' +
      '<button type="button" class="boton boton--primario" data-ir="4">Siguiente</button></div>';
  }

  function actualizarCuentas() {
    var preguntas = guion();
    datos.dimensiones.forEach(function (dimension) {
      var nodo = document.querySelector('[data-cuenta="' + dimension.codigo + '"]');
      if (!nodo) return;
      var deLaDimension = preguntas.filter(function (p) { return p.dimension === dimension.codigo; });
      nodo.textContent = deLaDimension.filter(function (p) { return respondida(p.clave); }).length + ' de ' + deLaDimension.length;
    });
    var total = document.getElementById('cuenta-total');
    if (total) {
      total.textContent = preguntas.filter(function (p) { return respondida(p.clave); }).length + ' de ' + preguntas.length + ' respondidas';
    }
  }

  function repintarPregunta(clave) {
    var pregunta = guion().filter(function (p) { return p.clave === clave; })[0];
    var nodo = document.getElementById('pregunta-' + clave);
    if (!pregunta || !nodo) return;
    var temporal = document.createElement('div');
    temporal.innerHTML = htmlPregunta(pregunta);
    nodo.replaceWith(temporal.firstChild);
    actualizarCuentas();
  }

  // --- Pasos 4 y 5: listas de texto libre ---------------------------------------------------

  // Cada lista: campos que la forman, rótulos y cómo se llama un elemento.
  var LISTAS = {
    preguntasTutor: {
      nuevo: function () { return { pregunta: '', respuesta: '' }; },
      campos: [['pregunta', 'Pregunta del tutor'], ['respuesta', 'Respuesta del equipo (puede quedar vacía)']],
      titulo: 'Pregunta', agregar: 'Agregar pregunta'
    },
    consultas: {
      nuevo: function () { return { preguntaEquipo: '', respuestaTutor: '' }; },
      campos: [['preguntaEquipo', 'Consulta del equipo'], ['respuestaTutor', 'Respuesta del tutor (puede quedar vacía)']],
      titulo: 'Consulta', agregar: 'Agregar consulta'
    }
  };

  function htmlLista(nombre) {
    var lista = LISTAS[nombre];
    var html = estado[nombre].map(function (elemento, i) {
      return '<div class="par"><div class="par__cabecera"><span class="rotulo">' + lista.titulo + ' ' + (i + 1) + '</span>' +
        '<button type="button" class="boton boton--neutro boton--chico" data-quitar="' + nombre + '" data-indice="' + i + '">Quitar</button></div>' +
        lista.campos.map(function (campo) {
          var id = nombre + '-' + i + '-' + campo[0];
          return '<div class="campo"><label for="' + id + '">' + campo[1] + '</label>' +
            '<textarea class="entrada entrada--corta" id="' + id + '" rows="2" maxlength="' + MAXIMO_TEXTO_LIBRE + '" data-lista="' + nombre + '" data-indice="' + i + '" data-campo="' + campo[0] + '">' +
            escapar(elemento[campo[0]]) + '</textarea></div>';
        }).join('') + '</div>';
    }).join('');
    return html + '<button type="button" class="boton boton--secundario" data-agregar="' + nombre + '">+ ' + lista.agregar + '</button>';
  }

  function htmlCompromisos() {
    var html = estado.compromisos.map(function (compromiso, i) {
      var id = 'compromiso-' + i;
      return '<div class="par"><div class="par__cabecera"><span class="rotulo">Compromiso ' + (i + 1) + '</span>' +
        '<button type="button" class="boton boton--neutro boton--chico" data-quitar="compromisos" data-indice="' + i + '">Quitar</button></div>' +
        '<div class="campo"><label for="' + id + '">Descripción</label>' +
        '<input class="entrada" id="' + id + '" maxlength="' + MAXIMO_TEXTO_LIBRE + '" data-lista="compromisos" data-indice="' + i + '" data-campo="descripcion" value="' + escapar(compromiso.descripcion) + '"></div>' +
        '<span class="campo__rotulo" id="' + id + '-responsable">Responsable</span>' +
        '<div class="chips" role="group" aria-labelledby="' + id + '-responsable">' +
        ['equipo', 'tutores'].map(function (valor) {
          return '<button type="button" class="chip" data-responsable="' + i + '" data-valor="' + valor + '" aria-pressed="' + (compromiso.responsable === valor) + '">' + ETIQUETA_RESPONSABLE[valor] + '</button>';
        }).join('') + '</div></div>';
    }).join('');
    if (estado.compromisos.length < datos.maximoCompromisos) {
      html += '<button type="button" class="boton boton--secundario" data-agregar="compromisos">+ Agregar compromiso</button>';
    } else {
      html += '<p class="texto-apoyo">Máximo ' + datos.maximoCompromisos + ' compromisos.</p>';
    }
    return html;
  }

  function htmlPaso4() {
    var vacia = !estado.preguntasTutor.length;
    return '<h1 class="paso__titulo">¿Qué más preguntaron?</h1>' +
      '<p class="paso__ayuda">Opcional. Preguntas que hicieron fuera del guion y lo que respondió el equipo</p>' +
      '<div class="lista-pares">' + htmlLista('preguntasTutor') + '</div>' + htmlError() +
      '<div class="acciones"><button type="button" class="boton boton--neutro" data-ir="3">Atrás</button>' +
      '<button type="button" class="boton ' + (vacia ? 'boton--secundario' : 'boton--primario') + '" data-ir="5">' + (vacia ? 'Omitir este paso' : 'Siguiente') + '</button></div>';
  }

  function htmlPaso5() {
    var vacio = !estado.consultas.length && !estado.compromisos.length;
    var etiqueta = vacio ? 'Omitir y guardar' : estado.tutoriaId ? 'Guardar cambios' : 'Guardar tutoría';
    return '<h1 class="paso__titulo">Consultas y compromisos</h1>' +
      '<p class="paso__ayuda">Opcional. Lo que preguntó el equipo y lo que quedó acordado para la próxima reunión</p>' +
      '<div class="rejilla-2 rejilla-2--ancha">' +
      '<section aria-labelledby="titulo-consultas"><h2 class="seccion__titulo" id="titulo-consultas">Consultas del equipo</h2><div class="lista-pares">' + htmlLista('consultas') + '</div></section>' +
      '<section aria-labelledby="titulo-compromisos"><h2 class="seccion__titulo" id="titulo-compromisos">Compromisos</h2><div class="lista-pares">' + htmlCompromisos() + '</div></section>' +
      '</div>' + htmlError() +
      '<div class="acciones"><button type="button" class="boton boton--neutro" data-ir="4">Atrás</button>' +
      '<button type="button" class="boton boton--primario" id="guardar">' + etiqueta + '</button></div>';
  }

  // --- Guardar ------------------------------------------------------------------------------

  function entradaParaGuardar() {
    var respuestas = {};
    guion().forEach(function (p) {
      if (!respondida(p.clave)) return;
      var r = estado.respuestas[p.clave];
      respuestas[p.clave] = r.otro
        ? { otro: true, texto: r.texto, color: r.color, nota: r.nota || '' }
        : { indice: r.indice, nota: r.nota || '' };
    });
    var tutor = function (eleccion) {
      return eleccion.otro ? { nombre: eleccion.nombre, apellido: eleccion.apellido } : { alias: eleccion.alias };
    };
    return {
      id: estado.tutoriaId,
      conduce: tutor(estado.conduce),
      registra: tutor(estado.registra),
      equipoNumero: estado.equipoNumero,
      hitoNumero: estado.hitoNumero,
      integrantes: { lista: estado.presentes, otros: estado.otrosIntegrantes },
      respuestas: respuestas,
      preguntasTutor: estado.preguntasTutor,
      consultas: estado.consultas,
      compromisos: estado.compromisos
    };
  }

  function guardar(boton) {
    boton.disabled = true;
    boton.textContent = 'Guardando...';
    estado.error = '';
    llamar('guardarTutoria', entradaParaGuardar()).then(function (resultado) {
      estado.tutoriaId = resultado.id;
      estado.semaforo = resultado.semaforo;
      // Registro nuevo: el borrador de acta anterior, si había, ya no corresponde.
      estado.acta = null;
      estado.fase = 'inicio';
      estado.observaciones = '';
      irA(PASO_ACTA);
    }).catch(function (error) {
      estado.error = 'No se pudo guardar: ' + mensajeDe(error);
      pintar();
    });
  }

  // --- Paso 6: semáforo y acta --------------------------------------------------------------

  function htmlSemaforo() {
    return '<div class="semaforo">' + datos.dimensiones.map(function (dimension) {
      var color = estado.semaforo && estado.semaforo[dimension.codigo];
      return '<div class="semaforo__item' + (color ? ' semaforo__item--' + color : '') + '">' +
        '<span class="punto punto--' + (color || 'sin') + '" aria-hidden="true"></span>' +
        '<div><div class="semaforo__nombre">' + dimension.codigo + ' · ' + escapar(dimension.nombre) + '</div>' +
        '<div class="semaforo__estado">' + (color ? ETIQUETA_COLOR[color] : 'Sin dato') + '</div></div></div>';
    }).join('') + '</div>';
  }

  function lineasObservaciones(texto) {
    return String(texto || '').split(/\r?\n/).map(function (linea) {
      return linea.replace(/^\s*[-*•]\s*/, '').trim();
    }).filter(function (linea) { return linea; });
  }

  function htmlVistaPrevia() {
    if (!estado.acta) return '';
    return estado.acta.bloques.map(function (bloque) {
      if (bloque.tipo === 'titulo') return '<div class="vista-previa__titulo">' + escapar(bloque.texto) + '</div>';
      if (bloque.tipo === 'parrafo') return bloque.texto ? '<p>' + escapar(bloque.texto) + '</p>' : '';
      if (bloque.tipo === 'encabezado') return '<h3>' + escapar(bloque.texto) + '</h3>';
      if (bloque.tipo === 'vinetas') {
        var lineas = lineasObservaciones(estado.observaciones);
        return '<ul id="vista-observaciones" class="' + (aprobada() ? '' : 'vista-previa__editable') + '">' +
          (lineas.length ? lineas : ['']).map(function (l) { return '<li>' + escapar(l) + '</li>'; }).join('') + '</ul>';
      }
      if (bloque.tipo === 'tabla') {
        return '<table><tbody>' + bloque.filas.map(function (fila, i) {
          return '<tr' + (bloque.conEncabezado && i === 0 ? ' class="encabezado"' : '') + '>' +
            fila.map(function (celda) { return '<td>' + escapar(celda) + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table>';
      }
      return '';
    }).join('');
  }

  function htmlOrigenTexto() {
    if (!estado.acta) return '';
    return estado.acta.generadoConIa
      ? 'Redactado por ' + escapar(estado.acta.modeloIa) + '. Revísalo y corrígelo: nada queda como definitivo sin tu aprobación.'
      : 'Gemini no respondió (o falta la clave), así que el texto salió de la plantilla sin IA. Revísalo antes de aprobar.';
  }

  function htmlPaso6() {
    var equipo = equipoElegido();
    var html = '<h1 class="paso__titulo">Semáforo y acta</h1>' +
      '<p class="paso__ayuda">Equipo ' + equipo.numero + ' · ' + escapar(hitoElegido().nombre) + '. La tutoría quedó guardada en la planilla</p>' +
      '<span class="rotulo">Estado por dimensión</span>' + htmlSemaforo();

    if (estado.fase === 'inicio') {
      html += '<div class="tarjeta"><span class="rotulo">Acta</span>' +
        '<p style="margin-top:0">Gemini redacta las observaciones generales a partir de lo registrado. Tú las revisas, las editas si quieres y apruebas el acta.</p>' +
        htmlError() +
        '<div class="acciones"><button type="button" class="boton boton--neutro" data-ir="3">Corregir registro</button>' +
        '<button type="button" class="boton boton--primario" id="generar">Generar acta</button></div></div>';
      return html;
    }
    if (estado.fase === 'generando') {
      return html + '<div class="cargando" role="status"><span class="giro"></span>Redactando el acta... puede tardar hasta un minuto</div>';
    }

    html += '<div class="revision"><div>';
    if (aprobada()) {
      html += '<div class="aviso aviso--exito" role="status">Acta aprobada. El documento quedó en la carpeta de actas de Impulsa.</div>' +
        htmlError() +
        '<div class="acciones" style="justify-content:flex-start">' +
        '<button type="button" class="boton boton--primario" id="descargar">Descargar .docx</button>' +
        '<a class="boton boton--neutro" href="' + escapar(estado.documento.documentoUrl) + '" target="_blank" rel="noopener">Abrir en Google Docs</a></div>' +
        '<p class="texto-apoyo">"Abrir en Google Docs" funciona solo con acceso a la carpeta de actas. La descarga funciona siempre.</p>' +
        '<div class="acciones"><span></span><button type="button" class="boton boton--secundario" id="otra">Registrar otra tutoría</button></div>';
    } else {
      var ocupado = estado.fase === 'aprobando';
      html += '<div class="campo"><label for="observaciones">Observaciones generales de la reunión</label>' +
        '<textarea class="entrada" id="observaciones" maxlength="5000"' + (ocupado ? ' disabled' : '') + '>' + escapar(estado.observaciones) + '</textarea>' +
        '<span class="marca-modelo">' + htmlOrigenTexto() + '</span></div>' +
        htmlError() +
        (ocupado ? '<div class="cargando" role="status"><span class="giro"></span>Creando el documento...</div>' :
        '<div class="acciones"><button type="button" class="boton boton--neutro" data-ir="3">Corregir registro</button>' +
        '<span style="display:flex;gap:var(--espacio-3);flex-wrap:wrap">' +
        '<button type="button" class="boton boton--secundario" id="generar">Volver a generar</button>' +
        '<button type="button" class="boton boton--primario" id="aprobar">Aprobar acta</button></span></div>');
    }
    html += '</div><section class="vista-previa" aria-label="Vista previa del acta" id="vista-previa">' + htmlVistaPrevia() + '</section></div>';
    return html;
  }

  function generar() {
    estado.fase = 'generando';
    estado.error = '';
    pintar();
    llamar('generarActa', estado.tutoriaId).then(function (acta) {
      estado.acta = acta;
      estado.observaciones = acta.texto;
      if (acta.estado === 'aprobada') {
        estado.fase = 'aprobada';
        estado.documento = { documentoUrl: acta.documentoUrl, nombreArchivo: acta.nombreArchivo };
      } else {
        estado.fase = 'borrador';
      }
      pintar();
    }).catch(function (error) {
      estado.fase = 'inicio';
      estado.error = 'No se pudo generar el acta: ' + mensajeDe(error);
      pintar();
    });
  }

  function aprobar() {
    if (!lineasObservaciones(estado.observaciones).length) {
      estado.error = 'Escribe al menos una observación antes de aprobar.';
      pintar();
      return;
    }
    estado.fase = 'aprobando';
    estado.error = '';
    pintar();
    llamar('aprobarActa', estado.tutoriaId, estado.observaciones).then(function (documento) {
      estado.documento = documento;
      estado.fase = 'aprobada';
      pintar();
    }).catch(function (error) {
      estado.fase = 'borrador';
      estado.error = 'No se pudo aprobar: ' + mensajeDe(error);
      pintar();
    });
  }

  function descargar(boton) {
    boton.disabled = true;
    boton.textContent = 'Preparando .docx...';
    llamar('descargarDocx', estado.tutoriaId).then(function (archivo) {
      var binario = atob(archivo.base64);
      var bytes = new Uint8Array(binario.length);
      for (var i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
      var blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
      var enlace = document.createElement('a');
      enlace.href = URL.createObjectURL(blob);
      enlace.download = archivo.nombreArchivo;
      document.body.appendChild(enlace);
      enlace.click();
      setTimeout(function () {
        URL.revokeObjectURL(enlace.href);
        enlace.remove();
      }, 1000);
      boton.disabled = false;
      boton.textContent = 'Descargar .docx';
    }).catch(function (error) {
      estado.error = 'No se pudo descargar: ' + mensajeDe(error);
      pintar();
    });
  }

  // --- Eventos (delegados en #contenido) ----------------------------------------------------

  var contenido = document.getElementById('contenido');

  contenido.addEventListener('submit', function (evento) {
    if (evento.target.id !== 'form-paso1') return;
    evento.preventDefault();
    estado.error = validarPaso1();
    if (estado.error) {
      pintar();
      return;
    }
    recordarTutores();
    irA(2);
  });

  contenido.addEventListener('input', function (evento) {
    var objetivo = evento.target;
    var d = objetivo.dataset;
    if (d.rol) {
      estado[d.rol][d.parte] = objetivo.value;
    } else if (objetivo.id === 'filtro-equipos') {
      estado.filtro = objetivo.value;
      pintarEquipos();
    } else if (d.nuevo) {
      estado.nuevoIntegrante[d.nuevo] = objetivo.value;
    } else if (d.otroTexto) {
      estado.respuestas[d.otroTexto].texto = objetivo.value;
      actualizarCuentas();
    } else if (d.nota) {
      estado.respuestas[d.nota].nota = objetivo.value;
    } else if (d.lista) {
      estado[d.lista][Number(d.indice)][d.campo] = objetivo.value;
    } else if (objetivo.id === 'observaciones') {
      estado.observaciones = objetivo.value;
      var vista = document.getElementById('vista-observaciones');
      if (vista) {
        var lineas = lineasObservaciones(objetivo.value);
        vista.innerHTML = (lineas.length ? lineas : ['']).map(function (l) { return '<li>' + escapar(l) + '</li>'; }).join('');
      }
    }
  });

  contenido.addEventListener('change', function (evento) {
    var objetivo = evento.target;
    var d = objetivo.dataset;
    if (d.tutor) {
      estado[d.tutor] = objetivo.value === OTRO_TUTOR ? { otro: true, nombre: '', apellido: '' } : { alias: objetivo.value };
      estado.verTodos = false;
      pintar();
      if (objetivo.value === OTRO_TUTOR) document.getElementById(d.tutor + '-nombre').focus();
    } else if (d.integrante !== undefined) {
      var nombre = equipoElegido().integrantes[Number(d.integrante)];
      estado.presentes = estado.presentes.filter(function (n) { return n !== nombre; });
      if (objetivo.checked) estado.presentes.push(nombre);
    } else if (d.otroColor) {
      estado.respuestas[d.otroColor].color = objetivo.value;
      var punto = document.querySelector('[data-otro-punto="' + CSS.escape(d.otroColor) + '"]');
      if (punto) punto.className = 'punto punto--' + (objetivo.value || 'sin');
      actualizarCuentas();
    }
  });

  contenido.addEventListener('keydown', function (evento) {
    if (evento.key === 'Enter' && evento.target.dataset.nuevo) {
      evento.preventDefault();
      agregarIntegrante();
    }
  });

  contenido.addEventListener('click', function (evento) {
    var boton = evento.target.closest('button, [data-ir]');
    if (!boton || boton.disabled) return;
    var d = boton.dataset;
    if (d.ir) {
      irA(Number(d.ir));
    } else if (boton.id === 'ver-todos') {
      estado.verTodos = !estado.verTodos;
      pintar();
    } else if (d.equipo) {
      elegirEquipo(Number(d.equipo));
    } else if (d.hito) {
      estado.hitoNumero = Number(d.hito);
      pintar();
    } else if (boton.id === 'agregar-integrante') {
      agregarIntegrante();
    } else if (d.quitarIntegrante !== undefined) {
      estado.otrosIntegrantes.splice(Number(d.quitarIntegrante), 1);
      pintar();
    } else if (boton.id === 'siguiente-2') {
      ajustarRespuestasAlGuion();
      irA(3);
    } else if (d.clave) {
      var clave = d.clave;
      var actual = estado.respuestas[clave];
      var nota = actual ? actual.nota || '' : '';
      if (d.otro) {
        if (!actual || !actual.otro) estado.respuestas[clave] = { otro: true, texto: '', color: '', nota: nota };
        repintarPregunta(clave);
        var campo = document.getElementById('otro-' + clave);
        if (campo) campo.focus();
      } else {
        var indice = Number(d.indice);
        // Tocar de nuevo la alternativa elegida la retira (pregunta no conversada).
        if (actual && !actual.otro && actual.indice === indice) delete estado.respuestas[clave];
        else estado.respuestas[clave] = { indice: indice, nota: nota };
        repintarPregunta(clave);
      }
    } else if (d.agregar) {
      var nuevo = d.agregar === 'compromisos' ? { descripcion: '', responsable: '' } : LISTAS[d.agregar].nuevo();
      estado[d.agregar].push(nuevo);
      pintar();
      var primero = document.querySelector('[data-lista="' + d.agregar + '"][data-indice="' + (estado[d.agregar].length - 1) + '"]');
      if (primero) primero.focus();
    } else if (d.quitar) {
      estado[d.quitar].splice(Number(d.indice), 1);
      pintar();
    } else if (d.responsable !== undefined) {
      estado.compromisos[Number(d.responsable)].responsable = d.valor;
      pintar();
    } else if (boton.id === 'guardar') {
      guardar(boton);
    } else if (boton.id === 'generar') {
      generar();
    } else if (boton.id === 'aprobar') {
      aprobar();
    } else if (boton.id === 'descargar') {
      descargar(boton);
    } else if (boton.id === 'otra') {
      estado = estadoInicial(leerTutoresRecordados());
      irA(1);
    }
  });

  // --- Vistas: Registro y Panel -------------------------------------------------------------
  // Cambiar de vista solo oculta la otra: un registro en curso queda tal como estaba.

  var nodoPanel = document.getElementById('panel');

  function cambiarVista(vista) {
    document.querySelectorAll('[data-vista]').forEach(function (boton) {
      boton.setAttribute('aria-pressed', String(boton.dataset.vista === vista));
    });
    document.getElementById('vista-registro').hidden = vista !== 'registro';
    nodoPanel.hidden = vista !== 'panel';
    window.scrollTo(0, 0);
    if (vista === 'panel' && !panel.datos && !panel.cargando) cargarPanel();
    (vista === 'panel' ? nodoPanel : document.getElementById('principal')).focus({ preventScroll: true });
  }

  document.querySelector('.vistas').addEventListener('click', function (evento) {
    var boton = evento.target.closest('[data-vista]');
    if (boton) cambiarVista(boton.dataset.vista);
  });

  // --- Panel de seguimiento -----------------------------------------------------------------
  // obtenerPanel entrega todo de una vez; los filtros se aplican aquí con resumirPanel, la misma
  // función de Codigo.gs (Index.html la incluye antes de este archivo).

  var ETIQUETA_ACTA = { aprobada: 'Aprobada', borrador: 'Borrador', 'sin acta': 'Sin generar' };
  var INICIAL_COLOR = { verde: 'V', amarillo: 'A', rojo: 'R' };
  var RANGO_COLOR = { rojo: 0, amarillo: 1, verde: 2 };
  var COLUMNAS_ESTADO = [
    ['numero', 'N°'], ['proyecto', 'Proyecto'], ['dupla', 'Dupla'], ['curso', 'Curso'],
    ['ultimaFecha', 'Última tutoría'], ['dias', 'Días']
  ];

  var panel = {
    datos: null,
    cargando: false,
    error: '',
    filtros: { semestre: '', curso: '', dupla: '', hito: '' },
    filtrosIniciados: false,
    orden: null, // null = rojos primero y más días sin tutoría; si no, {clave, ascendente}
    equipo: null, // clave 'semestre|numero' del equipo abierto
    buscarCompromisos: '',
    buscarConsultas: ''
  };

  function cargarPanel() {
    panel.cargando = true;
    panel.error = '';
    pintarPanel();
    llamar('obtenerPanel').then(function (datosPanel) {
      panel.datos = datosPanel;
      panel.cargando = false;
      if (!panel.filtrosIniciados) {
        panel.filtros.semestre = datosPanel.semestres[0] || '';
        panel.filtrosIniciados = true;
      }
      ajustarFiltros();
      pintarPanel();
    }).catch(function (error) {
      panel.cargando = false;
      panel.error = 'No se pudo cargar el panel: ' + mensajeDe(error);
      pintarPanel();
    });
  }

  /** Quita los filtros que ya no tienen opciones (por ejemplo, al cambiar de semestre). */
  function ajustarFiltros() {
    var f = panel.filtros;
    if (f.semestre && panel.datos.semestres.indexOf(f.semestre) === -1) f.semestre = panel.datos.semestres[0] || '';
    var opciones = resumirPanel(panel.datos, { semestre: f.semestre }).opciones;
    if (opciones.cursos.indexOf(f.curso) === -1) f.curso = '';
    if (opciones.duplas.indexOf(f.dupla) === -1) f.dupla = '';
    if (!opciones.hitos.some(function (h) { return String(h.numero) === f.hito; })) f.hito = '';
  }

  function claveDelEquipo(semestre, numero) {
    return semestre + '|' + numero;
  }

  function htmlColor(color, completo) {
    if (!ETIQUETA_COLOR[color]) {
      return '<span class="estado estado--sin" title="Sin dato">' +
        (completo ? 'Sin dato' : '<span aria-hidden="true">–</span><span class="oculto">Sin dato</span>') + '</span>';
    }
    return '<span class="estado estado--' + color + '" title="' + ETIQUETA_COLOR[color] + '">' +
      (completo ? ETIQUETA_COLOR[color] : '<span aria-hidden="true">' + INICIAL_COLOR[color] + '</span><span class="oculto">' + ETIQUETA_COLOR[color] + '</span>') + '</span>';
  }

  function encabezadosDimensiones() {
    return panel.datos.dimensiones.map(function (d) {
      return '<th scope="col" class="tabla__centro"><abbr title="' + escapar(d.nombre) + '">' + d.codigo + '</abbr></th>';
    }).join('');
  }

  function celdasDimensiones(colores) {
    return panel.datos.dimensiones.map(function (d) {
      return '<td class="tabla__centro">' + htmlColor(colores[d.codigo]) + '</td>';
    }).join('');
  }

  function htmlSelect(filtro, rotulo, todos, opciones) {
    var actual = panel.filtros[filtro];
    return '<div class="campo"><label for="filtro-' + filtro + '">' + rotulo + '</label>' +
      '<select class="entrada" id="filtro-' + filtro + '" data-filtro="' + filtro + '">' +
      '<option value=""' + (actual ? '' : ' selected') + '>' + todos + '</option>' +
      opciones.map(function (o) {
        return '<option value="' + escapar(o.valor) + '"' + (String(o.valor) === actual ? ' selected' : '') + '>' + escapar(o.texto) + '</option>';
      }).join('') + '</select></div>';
  }

  function htmlFiltros(opciones) {
    var lista = function (valores) {
      return valores.map(function (v) { return { valor: v, texto: v }; });
    };
    return '<div class="filtros">' +
      htmlSelect('semestre', 'Semestre', 'Todos los semestres', lista(panel.datos.semestres)) +
      htmlSelect('curso', 'Curso', 'Todos los cursos', lista(opciones.cursos)) +
      htmlSelect('dupla', 'Dupla', 'Todas las duplas', lista(opciones.duplas)) +
      htmlSelect('hito', 'Hito', 'Todos los hitos', opciones.hitos.map(function (h) { return { valor: String(h.numero), texto: h.nombre }; })) +
      '</div>' +
      '<p class="panel__nota">El estado actual es siempre la última tutoría de cada equipo: las tarjetas, el estado de los equipos, ' +
      'los problemas de hoy y las duplas no cambian con el filtro de hito. Ese filtro cambia la evolución, el historial y los compromisos y consultas.</p>';
  }

  function htmlTarjeta(valor, rotulo, detalle, alerta) {
    return '<div class="indicador' + (alerta ? ' indicador--alerta' : '') + '">' +
      '<span class="indicador__valor">' + valor + '</span>' +
      '<span class="indicador__rotulo">' + rotulo + '</span>' +
      (detalle ? '<span class="indicador__detalle">' + detalle + '</span>' : '') + '</div>';
  }

  function htmlTarjetas(resumen) {
    var t = resumen.tarjetas;
    return '<div class="indicadores">' +
      htmlTarjeta(t.tutorias, 'Tutorías realizadas', '') +
      htmlTarjeta(t.equiposConRojo, 'Equipos con rojo', 'en su última tutoría, de ' + t.equipos + ' equipos', t.equiposConRojo > 0) +
      htmlTarjeta(t.sinTutoriaReciente, 'Sin tutoría en ' + panel.datos.diasSinTutoria + ' días', 'incluye los que no tienen ninguna', false) +
      htmlTarjeta(t.actasAprobadas + '<span class="indicador__total"> / ' + t.tutorias + '</span>', 'Actas aprobadas', 'sobre el total de tutorías', false) +
      '</div>';
  }

  // --- Estado de los equipos y detalle ------------------------------------------------------

  function valorParaOrden(equipo, clave) {
    if (clave === 'dias') return equipo.diasDesdeUltima === null ? Infinity : equipo.diasDesdeUltima;
    if (clave === 'peor') return equipo.peor ? RANGO_COLOR[equipo.peor] : 3;
    if (clave === 'numero') return equipo.numero;
    return String(equipo[clave] || '').toLowerCase();
  }

  function equiposOrdenados(equipos) {
    if (!panel.orden) return equipos;
    var clave = panel.orden.clave;
    var signo = panel.orden.ascendente ? 1 : -1;
    return equipos.slice().sort(function (a, b) {
      var x = valorParaOrden(a, clave);
      var y = valorParaOrden(b, clave);
      var comparacion = typeof x === 'string' ? x.localeCompare(y, 'es') : (x === y ? 0 : x < y ? -1 : 1);
      return signo * comparacion || a.numero - b.numero;
    });
  }

  function htmlEncabezadoOrdenable(clave, rotulo, clase) {
    var activo = panel.orden && panel.orden.clave === clave;
    var sentido = activo ? (panel.orden.ascendente ? 'ascending' : 'descending') : 'none';
    return '<th scope="col"' + (clase ? ' class="' + clase + '"' : '') + ' aria-sort="' + sentido + '">' +
      '<button type="button" class="tabla__orden" data-orden="' + clave + '">' + rotulo +
      '<span aria-hidden="true">' + (activo ? (panel.orden.ascendente ? ' ▲' : ' ▼') : '') + '</span></button></th>';
  }

  function htmlEstado(resumen) {
    var html = '<section class="panel__seccion" aria-labelledby="titulo-estado">' +
      '<h2 class="seccion__titulo" id="titulo-estado">Estado de los equipos</h2>';
    if (!resumen.equipos.length) {
      return html + '<p class="texto-apoyo">No hay equipos activos con estos filtros.</p></section>';
    }
    html += '<p class="panel__ayuda">' + (panel.orden
      ? 'Orden elegido. <button type="button" class="enlace" id="orden-inicial">Volver a rojos primero</button>'
      : 'Rojos primero, después los que llevan más días sin tutoría.') + ' Toca un equipo para ver su historial.</p>' +
      '<div class="tabla-contenedor"><table class="tabla"><thead><tr>' +
      COLUMNAS_ESTADO.map(function (c, i) {
        return htmlEncabezadoOrdenable(c[0], c[1], i === 0 ? 'tabla__fija' : c[0] === 'dias' ? 'tabla__numero' : '');
      }).join('') + encabezadosDimensiones() + htmlEncabezadoOrdenable('peor', 'Peor', '') +
      '</tr></thead><tbody>' +
      equiposOrdenados(resumen.equipos).map(function (e) {
        var clave = claveDelEquipo(e.semestre, e.numero);
        var abierto = panel.equipo === clave;
        return '<tr' + (abierto ? ' class="tabla__fila--abierta"' : '') + '>' +
          '<th scope="row" class="tabla__fija"><button type="button" class="tabla__equipo" data-abrir-equipo="' + escapar(clave) + '" aria-expanded="' + abierto + '" aria-controls="detalle-equipo">' +
          escapar(e.numero) + '</button></th>' +
          '<td>' + escapar(e.proyecto) + '</td><td>' + escapar(e.dupla || 'Sin dupla') + '</td><td>' + escapar(e.curso) + '</td>' +
          '<td>' + (e.ultimaFecha ? escapar(e.ultimaFecha) : '<span class="texto-apoyo">Ninguna</span>') + '</td>' +
          '<td class="tabla__numero">' + (e.diasDesdeUltima === null ? '–' : escapar(e.diasDesdeUltima)) + '</td>' +
          celdasDimensiones(e.colores) + '<td>' + htmlColor(e.peor, true) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    // El detalle se cierra solo si los filtros dejan fuera al equipo abierto.
    var visible = resumen.equipos.some(function (e) { return claveDelEquipo(e.semestre, e.numero) === panel.equipo; });
    return html + (visible ? htmlDetalle() : '') + '</section>';
  }

  function delEquipoAbierto(fila) {
    return claveDelEquipo(fila.semestre, fila.equipoNumero) === panel.equipo &&
      (!panel.filtros.hito || String(fila.hitoNumero) === panel.filtros.hito);
  }

  function enlaceSeguro(url) {
    return /^https:\/\//.test(String(url || '')) ? url : '';
  }

  function htmlDetalle() {
    if (!panel.equipo) return '';
    var equipo = panel.datos.equipos.filter(function (e) { return claveDelEquipo(e.semestre, e.numero) === panel.equipo; })[0];
    if (!equipo) return '';
    var historial = panel.datos.tutorias.filter(delEquipoAbierto);
    var compromisos = panel.datos.compromisos.filter(delEquipoAbierto);
    var consultas = panel.datos.consultas.filter(delEquipoAbierto);
    var hito = panel.filtros.hito ? ' (solo el hito elegido en los filtros)' : '';
    var html = '<div class="tarjeta detalle" id="detalle-equipo" tabindex="-1" aria-labelledby="titulo-detalle">' +
      '<div class="detalle__cabecera"><div><span class="rotulo">Equipo ' + escapar(equipo.numero) + '</span>' +
      '<h3 class="detalle__titulo" id="titulo-detalle">' + escapar(equipo.proyecto) + '</h3>' +
      '<p class="texto-apoyo">' + escapar(equipo.curso) + ' · ' + escapar(equipo.dupla || 'Sin dupla') + ' · semestre ' + escapar(equipo.semestre) + '</p></div>' +
      '<button type="button" class="boton boton--neutro boton--chico" id="cerrar-detalle">Cerrar</button></div>' +
      '<h4 class="detalle__subtitulo">Historial de tutorías' + hito + '</h4>';
    if (!historial.length) {
      html += '<p class="texto-apoyo">Sin tutorías registradas' + (hito ? ' en ese hito' : '') + '.</p>';
    } else {
      html += '<div class="tabla-contenedor"><table class="tabla"><thead><tr><th scope="col" class="tabla__fija">Fecha</th><th scope="col">Hito</th>' +
        encabezadosDimensiones() + '<th scope="col">Acta</th></tr></thead><tbody>' +
        historial.map(function (t) {
          var url = enlaceSeguro(t.actaUrl);
          return '<tr><th scope="row" class="tabla__fija">' + escapar(t.fecha) + '</th><td>' + escapar(t.hitoNombre) + '</td>' +
            celdasDimensiones(t.colores) + '<td>' + escapar(ETIQUETA_ACTA[t.acta] || t.acta) +
            (url ? ' · <a href="' + escapar(url) + '" target="_blank" rel="noopener">Abrir acta</a>' : '') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }
    html += '<div class="rejilla-2 detalle__listas"><div><h4 class="detalle__subtitulo">Compromisos</h4>' +
      (compromisos.length ? '<ul class="detalle__lista">' + compromisos.map(function (c) {
        return '<li>' + escapar(c.descripcion) + ' <span class="texto-apoyo">· ' + escapar(c.responsable) + ' · ' + escapar(c.fecha) + '</span></li>';
      }).join('') + '</ul>' : '<p class="texto-apoyo">Sin compromisos.</p>') + '</div>' +
      '<div><h4 class="detalle__subtitulo">Consultas del equipo</h4>' +
      (consultas.length ? '<ul class="detalle__lista">' + consultas.map(function (c) {
        return '<li>' + escapar(c.pregunta) + (c.respuesta ? '<br><span class="texto-apoyo">Respuesta: ' + escapar(c.respuesta) + '</span>' : '') +
          ' <span class="texto-apoyo">· ' + escapar(c.fecha) + '</span></li>';
      }).join('') + '</ul>' : '<p class="texto-apoyo">Sin consultas.</p>') + '</div></div>';
    return html + '</div>';
  }

  // --- Gráficos (CSS, sin librerías) --------------------------------------------------------

  function htmlLeyenda(conSinDato) {
    var items = ['verde', 'amarillo', 'rojo'].map(function (c) {
      return '<span class="leyenda__item"><span class="leyenda__muestra leyenda__muestra--' + c + '"></span>' + ETIQUETA_COLOR[c] + '</span>';
    });
    if (conSinDato) items.push('<span class="leyenda__item"><span class="leyenda__muestra leyenda__muestra--sin"></span>Sin dato</span>');
    return '<div class="leyenda" aria-hidden="true">' + items.join('') + '</div>';
  }

  function porcentaje(parte, total) {
    return total ? Math.round((100 * parte) / total) : 0;
  }

  function htmlProblemas(resumen) {
    var html = '<section class="panel__seccion" aria-labelledby="titulo-problemas">' +
      '<h2 class="seccion__titulo" id="titulo-problemas">Dónde están los problemas hoy</h2>';
    var total = resumen.equipos.length;
    if (!total) return html + '<p class="texto-apoyo">No hay equipos activos con estos filtros.</p></section>';
    var nombres = {};
    panel.datos.dimensiones.forEach(function (d) { nombres[d.codigo] = d.nombre; });
    html += '<p class="panel__ayuda">Cuántos equipos están en cada color en su última tutoría, de ' + total + ' equipos.</p>' + htmlLeyenda(true) +
      '<div class="barras">' + resumen.problemas.map(function (p) {
        var tramos = [['verde', p.verde], ['amarillo', p.amarillo], ['rojo', p.rojo], ['sin', p.sinDato]];
        var texto = 'Verde ' + p.verde + ' · Amarillo ' + p.amarillo + ' · Rojo ' + p.rojo + ' · Sin dato ' + p.sinDato;
        return '<div class="barras__fila"><div class="barras__rotulo"><strong>' + p.codigo + '</strong> ' + escapar(nombres[p.codigo]) + '</div>' +
          '<div class="barra" role="img" aria-label="' + p.codigo + ': ' + texto + '">' +
          tramos.filter(function (t) { return t[1] > 0; }).map(function (t) {
            var ancho = (100 * t[1]) / total;
            return '<span class="barra__tramo barra__tramo--' + t[0] + '" style="width:' + ancho + '%" title="' +
              (t[0] === 'sin' ? 'Sin dato' : ETIQUETA_COLOR[t[0]]) + ': ' + t[1] + ' equipo(s)">' + (ancho >= 8 ? t[1] : '') + '</span>';
          }).join('') + '</div>' +
          '<div class="barras__cifras">' + texto + '</div></div>';
      }).join('') + '</div>';
    return html + '</section>';
  }

  function htmlEvolucion(resumen) {
    var html = '<section class="panel__seccion" aria-labelledby="titulo-evolucion">' +
      '<h2 class="seccion__titulo" id="titulo-evolucion">Evolución semanal</h2>';
    if (!resumen.semanas.length) return html + '<p class="texto-apoyo">Sin tutorías para estos filtros.</p></section>';
    html += '<p class="panel__ayuda">Por semana, la proporción de dimensiones en verde, amarillo y rojo de todas las tutorías de esa semana. Las dimensiones sin dato no cuentan.</p>' +
      htmlLeyenda(false) + '<div class="evolucion">' +
      resumen.semanas.map(function (s) {
        var tramos = [['rojo', s.rojo], ['amarillo', s.amarillo], ['verde', s.verde]];
        var texto = s.rotulo + ': ' + (s.total
          ? porcentaje(s.verde, s.total) + ' % verde, ' + porcentaje(s.amarillo, s.total) + ' % amarillo, ' + porcentaje(s.rojo, s.total) + ' % rojo'
          : 'sin dato') + ' (' + s.tutorias + ' tutoría(s))';
        return '<div class="evolucion__semana"><div class="evolucion__columna" role="img" aria-label="' + escapar(texto) + '" title="' + escapar(texto) + '">' +
          (s.total ? tramos.filter(function (t) { return t[1] > 0; }).map(function (t) {
            var alto = (100 * t[1]) / s.total;
            return '<span class="evolucion__tramo barra__tramo--' + t[0] + '" style="height:' + alto + '%">' + (alto >= 14 ? Math.round(alto) + '%' : '') + '</span>';
          }).join('') : '<span class="evolucion__tramo barra__tramo--sin" style="height:100%">–</span>') + '</div>' +
          '<span class="evolucion__rotulo">' + escapar(s.rotulo) + '</span>' +
          '<span class="evolucion__n">' + s.tutorias + ' tut.</span></div>';
      }).join('') + '</div>' +
      '<details class="ver-tabla"><summary>Ver como tabla</summary><div class="tabla-contenedor"><table class="tabla"><thead><tr>' +
      '<th scope="col" class="tabla__fija">Semana</th><th scope="col" class="tabla__numero">Tutorías</th><th scope="col" class="tabla__numero">Verde</th>' +
      '<th scope="col" class="tabla__numero">Amarillo</th><th scope="col" class="tabla__numero">Rojo</th></tr></thead><tbody>' +
      resumen.semanas.map(function (s) {
        return '<tr><th scope="row" class="tabla__fija">' + escapar(s.rotulo) + '</th><td class="tabla__numero">' + s.tutorias + '</td>' +
          ['verde', 'amarillo', 'rojo'].map(function (c) {
            return '<td class="tabla__numero">' + (s.total ? porcentaje(s[c], s.total) + ' %' : '–') + '</td>';
          }).join('') + '</tr>';
      }).join('') + '</tbody></table></div></details>';
    return html + '</section>';
  }

  // --- Duplas, compromisos y consultas ------------------------------------------------------

  function htmlDuplas(resumen) {
    var html = '<section class="panel__seccion" aria-labelledby="titulo-duplas">' +
      '<h2 class="seccion__titulo" id="titulo-duplas">Duplas</h2>';
    if (!resumen.duplas.length) return html + '<p class="texto-apoyo">No hay duplas con estos filtros.</p></section>';
    return html + '<p class="panel__ayuda">La dupla de cada tutoría es la del equipo. El porcentaje en rojo se calcula sobre las dimensiones con dato de la última tutoría de cada equipo.</p>' +
      '<div class="tabla-contenedor"><table class="tabla"><thead><tr><th scope="col" class="tabla__fija">Dupla</th>' +
      '<th scope="col" class="tabla__numero">Equipos a cargo</th><th scope="col" class="tabla__numero">Tutorías</th>' +
      '<th scope="col" class="tabla__numero">Sin tutoría en ' + panel.datos.diasSinTutoria + ' días</th>' +
      '<th scope="col" class="tabla__numero">Dimensiones en rojo</th><th scope="col" class="tabla__numero">Actas pendientes</th></tr></thead><tbody>' +
      resumen.duplas.map(function (d) {
        return '<tr><th scope="row" class="tabla__fija">' + escapar(d.dupla || 'Sin dupla') + '</th>' +
          '<td class="tabla__numero">' + d.equipos + '</td><td class="tabla__numero">' + d.tutorias + '</td>' +
          '<td class="tabla__numero">' + d.sinTutoriaReciente + '</td>' +
          '<td class="tabla__numero">' + (d.porcentajeRojo === null ? '–' : d.porcentajeRojo + ' %') + '</td>' +
          '<td class="tabla__numero">' + d.actasPendientes + '</td></tr>';
      }).join('') + '</tbody></table></div></section>';
  }

  function coincideBusqueda(fila, campos, busqueda) {
    var texto = claveNombre(busqueda);
    if (!texto) return true;
    return claveNombre(campos.map(function (c) { return fila[c]; }).join(' ')).indexOf(texto) !== -1;
  }

  function htmlTablaCompromisos(resumen) {
    var filas = resumen.compromisos.filter(function (c) {
      return coincideBusqueda(c, ['equipoNumero', 'equipoProyecto', 'hitoNombre', 'descripcion', 'responsable'], panel.buscarCompromisos);
    });
    if (!filas.length) return '<p class="texto-apoyo">' + (resumen.compromisos.length ? 'Ningún compromiso coincide con la búsqueda.' : 'Sin compromisos para estos filtros.') + '</p>';
    return '<div class="tabla-contenedor"><table class="tabla"><thead><tr><th scope="col" class="tabla__fija">Fecha</th><th scope="col">Equipo</th>' +
      '<th scope="col">Hito</th><th scope="col">Compromiso</th><th scope="col">Responsable</th></tr></thead><tbody>' +
      filas.map(function (c) {
        return '<tr><th scope="row" class="tabla__fija">' + escapar(c.fecha) + '</th><td>' + escapar(c.equipoNumero) + ' · ' + escapar(c.equipoProyecto) + '</td>' +
          '<td>' + escapar(c.hitoNombre) + '</td><td class="tabla__texto">' + escapar(c.descripcion) + '</td><td>' + escapar(c.responsable) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function htmlTablaConsultas(resumen) {
    var filas = resumen.consultas.filter(function (c) {
      return coincideBusqueda(c, ['equipoNumero', 'equipoProyecto', 'hitoNombre', 'pregunta', 'respuesta'], panel.buscarConsultas);
    });
    if (!filas.length) return '<p class="texto-apoyo">' + (resumen.consultas.length ? 'Ninguna consulta coincide con la búsqueda.' : 'Sin consultas para estos filtros.') + '</p>';
    return '<div class="tabla-contenedor"><table class="tabla"><thead><tr><th scope="col" class="tabla__fija">Fecha</th><th scope="col">Equipo</th>' +
      '<th scope="col">Hito</th><th scope="col">Consulta del equipo</th><th scope="col">Respuesta del tutor</th></tr></thead><tbody>' +
      filas.map(function (c) {
        return '<tr><th scope="row" class="tabla__fija">' + escapar(c.fecha) + '</th><td>' + escapar(c.equipoNumero) + ' · ' + escapar(c.equipoProyecto) + '</td>' +
          '<td>' + escapar(c.hitoNombre) + '</td><td class="tabla__texto">' + escapar(c.pregunta) + '</td>' +
          '<td class="tabla__texto">' + (c.respuesta ? escapar(c.respuesta) : '<span class="texto-apoyo">Sin respuesta</span>') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function htmlCompromisosYConsultas(resumen) {
    return '<section class="panel__seccion" aria-labelledby="titulo-compromisos-panel">' +
      '<h2 class="seccion__titulo" id="titulo-compromisos-panel">Compromisos y consultas</h2>' +
      '<h3 class="detalle__subtitulo">Compromisos</h3>' +
      '<div class="campo panel__buscar"><label for="buscar-compromisos">Buscar en compromisos</label>' +
      '<input class="entrada" id="buscar-compromisos" type="search" placeholder="Equipo, texto o responsable" value="' + escapar(panel.buscarCompromisos) + '"></div>' +
      '<div id="tabla-compromisos">' + htmlTablaCompromisos(resumen) + '</div>' +
      '<h3 class="detalle__subtitulo">Consultas del equipo</h3>' +
      '<div class="campo panel__buscar"><label for="buscar-consultas">Buscar en consultas</label>' +
      '<input class="entrada" id="buscar-consultas" type="search" placeholder="Equipo, pregunta o respuesta" value="' + escapar(panel.buscarConsultas) + '"></div>' +
      '<div id="tabla-consultas">' + htmlTablaConsultas(resumen) + '</div></section>';
  }

  // --- Pintar el panel ----------------------------------------------------------------------

  function resumenActual() {
    var f = panel.filtros;
    return resumirPanel(panel.datos, { semestre: f.semestre, curso: f.curso, dupla: f.dupla, hito: f.hito });
  }

  function htmlPanel() {
    var html = '<div class="panel__cabecera"><div><h1 class="paso__titulo">Panel de seguimiento</h1>' +
      '<p class="paso__ayuda">' + (panel.datos ? 'Calculado con la planilla el ' + escapar(panel.datos.hoy) + '.' : 'Estado de los equipos a partir de la planilla.') + '</p></div>' +
      '<button type="button" class="boton boton--secundario" id="actualizar-panel"' + (panel.cargando ? ' disabled' : '') + '>' +
      (panel.cargando ? 'Actualizando...' : 'Actualizar') + '</button></div>';
    if (panel.error) html += '<div class="aviso aviso--error" role="alert">' + escapar(panel.error) + '</div>';
    if (!panel.datos) {
      return html + (panel.cargando ? '<div class="cargando" role="status"><span class="giro"></span>Leyendo la planilla...</div>' : '');
    }
    if (!panel.datos.equipos.length && !panel.datos.tutorias.length) {
      return html + '<div class="aviso aviso--info">La planilla todavía no tiene equipos activos ni tutorías. Cuando coordinación cargue la pestaña Equipos y se guarde la primera tutoría, el panel se llena.</div>';
    }
    var resumen = resumenActual();
    html += htmlFiltros(resumen.opciones);
    if (!panel.datos.tutorias.length) {
      html += '<div class="aviso aviso--info">Todavía no hay tutorías registradas. Mientras tanto, todos los equipos aparecen sin tutoría.</div>';
    } else if (!resumen.equipos.length && !resumen.tarjetas.tutorias) {
      return html + '<div class="aviso aviso--info">Ningún equipo ni tutoría coincide con estos filtros.</div>' +
        '<button type="button" class="boton boton--neutro" id="quitar-filtros">Quitar filtros</button>';
    }
    return html + htmlTarjetas(resumen) + htmlEstado(resumen) + htmlProblemas(resumen) + htmlEvolucion(resumen) +
      htmlDuplas(resumen) + htmlCompromisosYConsultas(resumen);
  }

  function pintarPanel() {
    // Repintar no debe perder el foco del control que se estaba usando.
    var enfocado = document.activeElement && nodoPanel.contains(document.activeElement) ? document.activeElement : null;
    var idEnfocado = enfocado && enfocado.id;
    var abrirEquipo = enfocado && enfocado.dataset.abrirEquipo;
    var orden = enfocado && enfocado.dataset.orden;
    nodoPanel.innerHTML = '<div class="panel__marco">' + htmlPanel() + '</div>';
    var nuevo = idEnfocado ? document.getElementById(idEnfocado)
      : abrirEquipo ? nodoPanel.querySelector('[data-abrir-equipo="' + CSS.escape(abrirEquipo) + '"]')
      : orden ? nodoPanel.querySelector('[data-orden="' + CSS.escape(orden) + '"]') : null;
    if (nuevo && !nuevo.disabled) nuevo.focus({ preventScroll: true });
  }

  nodoPanel.addEventListener('change', function (evento) {
    var filtro = evento.target.dataset.filtro;
    if (!filtro) return;
    panel.filtros[filtro] = evento.target.value;
    if (filtro === 'semestre') ajustarFiltros();
    pintarPanel();
  });

  nodoPanel.addEventListener('input', function (evento) {
    var objetivo = evento.target;
    if (objetivo.id === 'buscar-compromisos') {
      panel.buscarCompromisos = objetivo.value;
      document.getElementById('tabla-compromisos').innerHTML = htmlTablaCompromisos(resumenActual());
    } else if (objetivo.id === 'buscar-consultas') {
      panel.buscarConsultas = objetivo.value;
      document.getElementById('tabla-consultas').innerHTML = htmlTablaConsultas(resumenActual());
    }
  });

  nodoPanel.addEventListener('click', function (evento) {
    var boton = evento.target.closest('button');
    if (!boton || boton.disabled) return;
    var d = boton.dataset;
    if (boton.id === 'actualizar-panel') {
      cargarPanel();
    } else if (boton.id === 'quitar-filtros') {
      panel.filtros = { semestre: panel.datos.semestres[0] || '', curso: '', dupla: '', hito: '' };
      pintarPanel();
    } else if (d.orden) {
      var mismo = panel.orden && panel.orden.clave === d.orden;
      // Los días y el peor color empiezan por lo más urgente.
      var inicial = d.orden !== 'dias';
      panel.orden = { clave: d.orden, ascendente: mismo ? !panel.orden.ascendente : inicial };
      pintarPanel();
    } else if (boton.id === 'orden-inicial') {
      panel.orden = null;
      pintarPanel();
    } else if (d.abrirEquipo) {
      panel.equipo = panel.equipo === d.abrirEquipo ? null : d.abrirEquipo;
      pintarPanel();
      var detalle = document.getElementById('detalle-equipo');
      if (detalle) {
        detalle.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        detalle.focus({ preventScroll: true });
      }
    } else if (boton.id === 'cerrar-detalle') {
      var clave = panel.equipo;
      panel.equipo = null;
      pintarPanel();
      var fila = nodoPanel.querySelector('[data-abrir-equipo="' + CSS.escape(clave) + '"]');
      if (fila) fila.focus();
    }
  });

  // --- Arranque -----------------------------------------------------------------------------

  llamar('obtenerDatosIniciales').then(function (respuesta) {
    datos = respuesta;
    estado = estadoInicial(leerTutoresRecordados());
    if (datos.semestre) {
      var chip = document.getElementById('semestre');
      chip.textContent = 'Semestre ' + datos.semestre;
      chip.hidden = false;
    }
    pintar();
  }).catch(function (error) {
    contenido.innerHTML = '<div class="aviso aviso--error" role="alert">No se pudieron leer los datos de la planilla: ' +
      escapar(mensajeDe(error)) + '</div>';
  });
</script>
